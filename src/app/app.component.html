<app-site-header
  [units]="temarioUnits"
  [activeUnit]="activeTemarioUnit()"
  [menuOpen]="menuOpen()"
  (unitSelect)="selectTemarioUnit($event)"
  (menuToggle)="toggleMenu()" />

<div
  class="app-offcanvas"
  id="mobileNavigation"
  [class.is-open]="menuOpen()"
  role="dialog"
  aria-modal="true"
  aria-label="Menú de navegación"
  (keydown.escape)="closeMenu()">
  <div class="app-offcanvas__backdrop" (click)="closeMenu()"></div>
  <div class="app-offcanvas__panel">
    <div class="app-offcanvas__header">
      <h2 class="app-offcanvas__title">Ejemplos</h2>
      <button class="btn btn-sm btn-outline-secondary" type="button" (click)="closeMenu()" aria-label="Cerrar menú">
        <svg class="app-theme-toggle__icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    <div class="app-offcanvas__body">
      <a class="app-offcanvas__link" routerLink="/home" routerLinkActive="active" (click)="closeMenu()">Inicio</a>

      <app-temario-mobile-menu [units]="temarioUnits" (linkSelect)="closeMenu()" />

      <a class="app-offcanvas__link" routerLink="/about" routerLinkActive="active" (click)="closeMenu()">Acerca de</a>
    </div>

    <div class="app-offcanvas__theme">
      <button class="btn btn-outline-secondary w-100 d-flex align-items-center justify-content-center gap-2" type="button" (click)="toggleTheme()">
        @if (themeService.resolvedTheme() === 'dark') {
          <svg class="app-theme-toggle__icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          <span>Usar modo claro</span>
        } @else {
          <svg class="app-theme-toggle__icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
          <span>Usar modo oscuro</span>
        }
      </button>
    </div>
  </div>
</div>

<main class="app-main container">
  @if (apiErrorService.lastError(); as errorMessage) {
    <div class="alert alert-danger d-flex justify-content-between align-items-start gap-3" role="alert">
      <span>{{ errorMessage }}</span>
      <button class="btn-close" type="button" aria-label="Cerrar aviso" (click)="apiErrorService.clear()"></button>
    </div>
  }
  <app-fuente-ejemplo />
  <router-outlet />
</main>

<footer class="app-footer">
  <div class="container">
    Angular · Aprende haciendo · Ejemplos didácticos para aprender Angular paso a paso.
  </div>
</footer>
